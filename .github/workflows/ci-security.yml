name: Technica LMS CI / Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technica-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check infrastructure policies
        run: node scripts/check-infrastructure.mjs

      - name: Install dependencies reproducibly
        run: npm ci --no-fund

      - name: TypeScript typecheck when the repository has a typecheck script
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo "::warning::TypeScript/typecheck not yet configured (legacy JS demo). Typecheck gate is PENDING, not PASS."
          fi

      - name: Scientific calculator math and quiz integration
        run: npm run test:calculator

      - name: Structured math entry, exact arithmetic and calculator menu regression
        run: npm run test:calculator:mathprint

      - name: Advanced scientific calculator modes and mathematical regression
        run: npm run test:calculator:extended

      - name: TI-30XS MultiView guidebook reference audit
        run: npm run test:calculator:ti-audit

      - name: Physical calculator reference layout regression
        run: npm run test:calculator:physical

      - name: Practice quick-select modes, presets and history regression
        run: npm run test:practice-modes

      - name: Course > Domain > Topic > Lesson hierarchy regression
        run: npm run test:hierarchy

      - name: Supabase production-mode repository / identity contracts
        run: npm run test:p3

      - name: P7 live Course Builder and hierarchy contract
        run: npm run test:authoring:live

      - name: P8 proportional Adaptive Level Up and verified Learner catalog contracts
        run: npm run test:adaptive:live

      - name: P8c read-only Admin bank readiness and fail-closed 10/25/50 checks
        run: npm run test:adaptive:admin

      - name: P4 secure practice model and ASP draft import contract
        run: |
          npm run test:p4
          npm run test:p4:bank

      - name: P9A read-only ASP release governance preflight contract
        run: npm run test:p9a

      - name: P9B explicitly reserved 200 ASP Mock + independent per-question Practice approval contract
        run: npm run test:p9b

      - name: P9C strict SELECT-only ASP bank audit contract
        run: npm run test:p9c

      - name: P9C concise owner decision summary read-only contract
        run: npm run test:p9c:decision
      
      - name: P9D.1 private 2500-question offline source and snapshot-diff security tests
        run: npm run test:p9d1

      - name: P10 protected 200-question 300-minute official Mock engine contract
        run: npm run test:p10

      - name: P11 learner-owned course, domain and topic verified progress analytics contract
        run: npm run test:p11

      - name: P12 read-only Admin release diagnostics, NO-GO and zero-mutation contract
        run: npm run test:p12

      - name: P12.2 staging 19-scenario QA/roles/NO-GO proof using synthetic clients (no real keys)
        run: npm run test:p12:staging

      - name: P13 unified Admin Tools routes, dynamic analytics and exclusive Mock UI contracts
        run: npm run test:p13

      - name: P14 secure private Lesson PDF/video authoring and playback contract
        run: npm run test:p14

      - name: P15 published Learner courses, Free Intro and local-only Checkout contracts
        run: npm run test:p15

      - name: P16 enrollment checkout simulation and locked Lesson redirect contract
        run: npm run test:p16

      - name: P17 premium Course cards, cover security and Real vs Demo My Learning contracts
        run: npm run test:p17

      - name: P18 premium My Learning and P11 verified progress contract
        run: npm run test:p18

      - name: P37 visible subscription header slot even without active plan
        run: npm run test:p37:header

      - name: P36 verified subscription remaining-days header countdown
        run: npm run test:p36:countdown

      - name: P35 premium qualification card hero images and accessible typography
        run: npm run test:p35:cards

      - name: P34 Unit-specific PDF study material mapping and Learner/Admin layout contract
        run: npm run test:p34:materials

      - name: P26 Qualification portfolio resources, contact diary, records and admin workflow preview
        run: npm run test:p26:qualification

      - name: P24 Qualifications and Evidence Mapping frontend contract
        run: npm run test:p19

      - name: P19-M protected course media fullscreen and blackout regressions
        run: npm run test:p19:media

      - name: P20 direct Lesson media and site loading/performance contracts
        run: npm run test:p20:performance

      - name: P21 platform-wide subscriptions, admin plans and expiration access contracts
        run: npm run test:p21:subscriptions

      - name: P38 premium Subscription Plans UI and real-price presentation
        run: npm run test:p38:subscription-ui

      - name: P39 unified Mock Exam and Practice menu with real P10 200/5h delivery
        run: npm run test:p39:exam-practice

      - name: P41 Open Access published-only and learner presentation contract
        run: npm run test:p41:open-access

      - name: P42 ASP Mock selected bank, guarded identity recovery and official 200-question learner gates
        run: npm run test:p42:mock-selection

      - name: P45 approved compact screenshot design regression
        run: npm run test:p45:build-your-own-design

      - name: P49 profile, plan countdown and verified My Practice history navigation
        run: npm run test:p49:profile

      - name: P54 real notification inbox permissions, membership snapshots and block notes
        run: npm run test:p54

      - name: P57 open Learner Signup and Google OAuth without client-granted roles
        run: npm run test:p57

      - name: P58 learner-owned Kill Mistakes from graded Practice, Mock and Lesson Quiz
        run: npm run test:p58

      - name: P59 verified Google identities, Free/active platform plans and user controls visibility
        run: npm run test:p59

      - name: P60 protected media Edge origin and private-access release contract
        run: npm run test:p60

      - name: P61 protected video preview playback, codec error and sparse watermark
        run: npm run test:p61

      - name: P56 authorized All Courses Practice and adaptive regression contract
        run: npm run test:p56

      - name: P44 Build Your Own validated configuration, server-only protected questions and 100 cap
        run: npm run test:p44:build-your-own

      - name: P22 premium course/lesson grid, verified progress and Admin quiz contracts
        run: npm run test:p22:learning

      - name: P23 continuous lesson, jump navigation and completion regression
        run: npm run test:p23:lesson

      - name: P27 verified Admin pie charts, safe draft Course Preview and learner nonregression
        run: npm run test:p27:admin

      - name: P28 per-Course Excel Question Bank and Lesson Quiz / Mock exclusion contract
        run: npm run test:p28:bank

      - name: P29 per-question Active/Mock Exam and Course Lesson Quiz selection contract
        run: npm run test:p29:bank

      - name: P30 compact Question Bank, staged edits and one atomic Save contract
        run: npm run test:p30:bank

      - name: P31 learner Lesson Quiz published-only P22 fetch, same-page jump and Draft approval gate
        run: npm run test:p31:lesson-quiz

      - name: P32 Admin actual Lesson Quiz published vs Draft read-only diagnostics and deep links
        run: npm run test:p32:quiz-visibility

      - name: P33 explicit learner Quiz tab, 0 Published clarity and Draft approval pathway
        run: npm run test:p33:learner-quiz

      - name: P34 single Save Lesson Quiz and secure Selected Mock frontend contracts
        run: npm run test:p34:one-save

      - name: P34 pre-migration compatibility preserves legacy P30 Admin settings with truthful publish status
        run: npm run test:p34:compatibility

      - name: P5 native fullscreen and exit policy contracts
        run: npm run test:p5

      - name: P6A ASP question review security contracts
        run: npm run test:p6

      - name: Review connection diagnostics (no secrets, no role bypass)
        run: npm run test:review:connection

      - name: Mandatory real email-password portal authentication contract
        run: npm run test:auth:portal

      - name: Protected exam and video deterrence contract
        run: npm run test:content-protection

      - name: P1 schema contract (static checks only)
        run: npm run test:p1:schema

      - name: Legacy project integrity
        run: npm run check

      - name: ASP imported bank integrity
        run: npm run verify:bank

      - name: Existing regression suites
        shell: bash
        run: |
          for name in test:selection verify:images test:auth test:motion test:courses test:quiz-navigation test:review test:admin test:course-dialog test:authoring test:admin-bank test:lesson-media test:learner-ui test:learning; do
            npm run "$name"
          done

      - name: Production build (public Supabase injection fixture)
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-public-key
        run: npm run build

      - name: Verify real reviewer HTML and public build-time config
        env:
          REVIEW_EXPECT_PUBLIC_BUILD_VARS: '1'
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-public-key
        run: npm run test:review:entry

      - name: Build isolated Supabase bundle and prove demo question answers are absent
        env:
          VITE_DATA_MODE: supabase
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-public-key
        run: |
          npm run build
          npm run test:p3:bundle

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Note remaining production gates
        run: |
          echo "Passing this CI validates a DEMO build only, not real Supabase/RLS, server grading, payments, DRM or Production readiness."
          echo "See TECHNICA_LMS_MASTER_BLUEPRINT.md and docs/current/RELEASE_SECURITY_CHECKLIST.md."

  p1-postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Apply P1 schema to disposable PostgreSQL and test RLS
        run: bash scripts/test-p1-postgres-smoke.sh
      - name: P4 secure question/attempt transactional and privilege smoke
        run: bash scripts/test-p4-postgres-smoke.sh
      - name: P5 fullscreen exit seals and redacts backend question attempts
        run: bash scripts/test-p5-postgres-smoke.sh

      - name: P6A ASP nine-domain human review and admin privilege smoke
        run: bash scripts/test-p6-postgres-smoke.sh

      - name: P8 server-graded adaptive Level Up — 10/25/50 question staging smoke
        run: bash scripts/test-p8-postgres-smoke.sh

      - name: P9A ASP governance preflight — no DB writes and strict Admin-only access
        run: bash scripts/test-p9a-postgres-smoke.sh

      - name: P9C zero-write real-schema ASP bank audit BEFORE optional P9B install
        run: bash scripts/test-p9c-postgres-smoke.sh pre

      - name: P9B transactional 200-question Mock and two-Admin approval on disposable PostgreSQL
        run: bash scripts/test-p9b-postgres-smoke.sh

      - name: P9C zero-write ASP bank audit AFTER P9B fixture reservation
        run: bash scripts/test-p9c-postgres-smoke.sh post

      - name: P9D.1 private ASP fingerprint SELECT and SHA256 normalization on disposable PostgreSQL
        run: bash scripts/test-p9d1-postgres-smoke.sh

      - name: P10 200x300 official Mock ACL, score, flags, deadline and fullscreen sealing on disposable PostgreSQL
        run: bash scripts/test-p10-postgres-smoke.sh

      - name: P11 secure P2 Practice and Mock Analytics on disposable PostgreSQL
        run: bash scripts/test-p11-postgres-smoke.sh

      - name: P13 real-schema Admin KPI and learner profiles protected read-only on disposable PostgreSQL
        run: bash scripts/test-p13-postgres-smoke.sh

      - name: P14 private Storage intent and atomic media finalization on disposable PostgreSQL
        run: bash scripts/test-p14-postgres-smoke.sh

      - name: P15 published Intro and locked-outline RLS on disposable PostgreSQL
        run: bash scripts/test-p15-postgres-smoke.sh

      - name: P17 public Course cover Storage/Admin RLS and audit on disposable PostgreSQL
        run: bash scripts/test-p17-postgres-smoke.sh

      - name: P21 subscription plans, admin-only activation, cross-course access, expiry and revocation on disposable PostgreSQL
        run: bash scripts/test-p21-postgres-smoke.sh

      - name: P22 learner lesson step events and Knowledge Check authorization on disposable PostgreSQL
        run: bash scripts/test-p22-postgres-smoke.sh

      - name: Clone P22 baseline for original-P28-to-P28.2 forward-upgrade test
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d template1 -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE technica_p28_upgrade TEMPLATE postgres;"

      - name: P28 Course Question Bank SQL RLS / no-cross-course Quiz / Mock exclusion
        run: bash scripts/test-p28-postgres-smoke.sh

      - name: P28.2 forward-upgrade original installed P28 without touching the primary CI database
        run: bash scripts/test-p28-forward-upgrade-postgres-smoke.sh

      - name: P29 protected Active and Mock candidate, live Practice/Level Up exclusions
        run: bash scripts/test-p29-postgres-smoke.sh

      - name: P29 real upgrade compatibility on original P28 then P28.2 (old and new Bank RPC)
        run: bash scripts/test-p29-forward-upgrade-postgres-smoke.sh

      - name: P30 single-request atomic Admin Question Bank save and Mock/Level Up protection
        run: bash scripts/test-p30-postgres-smoke.sh

      - name: P34 new/existing Draft Lesson Quiz publish and separated Mock attempt grading
        run: bash scripts/test-p34-postgres-smoke.sh

      - name: P41 server-controlled access switch on disposable PostgreSQL
        run: bash scripts/test-p41-postgres-smoke.sh

      - name: P44 customizable Practice with 100-question maximum and server-governed timers and grading
        run: bash scripts/test-p44-postgres-smoke.sh

      - name: Test scope disclosure
        run: echo "Ephemeral local PostgreSQL smoke only; live Supabase Auth, Storage, Data API and device tests still pending."
